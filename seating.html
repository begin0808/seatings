<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小王子的星際旅行 - 動態座位表</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --space-blue: #1a237e;
            --star-gold: #fdd835;
            --planet-cream: #fff9c4;
            --rose-red: #ff4081;
            --baobab-brown: #5d4037;
            --sky-light: #e8eaf6;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Patrick Hand', 'Noto Sans TC', cursive, sans-serif;
            background-color: var(--space-blue);
            /* 星空背景 */
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 20px),
                radial-gradient(rgba(255,255,255,.4), rgba(255,255,255,.1) 2px, transparent 30px);
            background-size: 550px 550px, 350px 350px, 250px 250px, 150px 150px;
            background-position: 0 0, 40px 60px, 130px 270px, 70px 100px;
            
            color: var(--planet-cream);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            color: var(--star-gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            font-size: 3em;
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 1px;
        }
        
        h1 span {
            font-size: 0.5em;
            display: block;
            color: #fff;
            margin-top: 5px;
            font-weight: normal;
        }

        /* 控制面板 */
        .controls {
            margin-bottom: 25px;
            padding: 25px;
            background: #fff;
            border-radius: 20px 5px 20px 5px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            color: var(--text-color);
            border: 2px dashed var(--star-gold);
            max-width: 800px;
            width: 95%;
            position: relative;
        }
        
        /* 裝飾 */
        .controls::after {
            content: '';
            position: absolute;
            top: -5px; left: 50%; transform: translateX(-50%);
            width: 50px; height: 5px;
            background: var(--star-gold);
            border-radius: 5px;
        }

        .controls h3 {
            margin-top: 0;
            color: var(--space-blue);
            border-bottom: 2px dotted var(--star-gold);
            display: inline-block;
            padding-bottom: 5px;
            font-size: 1.4em;
            margin-bottom: 15px;
        }

        /* 說明書按鈕樣式 */
        .help-link {
            text-decoration: none;
            color: var(--space-blue);
            background: #e3f2fd;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            border: 1px solid var(--space-blue);
            display: inline-block;
            transition: 0.2s;
        }
        .help-link:hover {
            background: #bbdefb;
            transform: scale(1.05);
        }

        /* 輸入區塊樣式 */
        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            border: 2px solid var(--space-blue);
            border-radius: 8px;
            font-size: 1.1em;
            font-family: 'Patrick Hand', cursive;
            text-align: center;
            color: var(--space-blue);
            font-weight: bold;
        }

        /* 按鈕群組 */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            background: var(--star-gold);
            color: var(--space-blue);
            padding: 8px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            font-family: 'Patrick Hand', cursive;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(253, 216, 53, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 15px rgba(253, 216, 53, 0.6);
        }
        
        .btn.create {
            background: var(--space-blue);
            color: white;
            box-shadow: 0 4px 10px rgba(26, 35, 126, 0.4);
        }

        .btn.secondary {
            background: #90a4ae;
            color: white;
            box-shadow: 0 4px 10px rgba(144, 164, 174, 0.4);
        }

        .btn.save {
            background: #66bb6a;
            color: white;
            box-shadow: 0 4px 10px rgba(102, 187, 106, 0.4);
        }
        
        .hint {
            font-size: 1em;
            color: #795548;
            margin-top: 5px;
        }

        /* 講台與計數器 */
        .podium-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .teacher-desk {
            font-size: 1.8em;
            color: var(--rose-red);
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 64, 129, 0.3);
        }
        
        #capacity-counter {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--star-gold);
            padding: 8px 20px;
            border-radius: 30px;
            color: var(--planet-cream);
            font-size: 1.2em;
            backdrop-filter: blur(5px);
        }

        /* 座位表網格：動態調整 */
        .grid-container {
            display: grid;
            /* grid-template-columns 會由 JS 動態設定 */
            gap: 15px;
            max-width: 100%;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow-x: auto;
        }

        @media (max-width: 768px) {
            .grid-container {
                gap: 8px;
                padding: 10px;
            }
            .seat {
                width: 50px !important;
                height: 50px !important;
            }
            .seat-name {
                font-size: 0.7em !important;
            }
            .seat-number {
                font-size: 0.8em !important;
                padding: 1px 3px !important;
            }
            h1 { font-size: 2em; }
        }

        /* 座位：小行星 */
        .seat {
            width: 85px;
            height: 85px;
            background: var(--planet-cream);
            background-image: radial-gradient(circle at 30% 30%, var(--planet-cream), #fff59d);
            border-radius: 50%;
            border: 3px solid #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            user-select: none;
            color: var(--text-color);
        }

        /* 空位 */
        .seat.empty {
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.6);
        }
        
        .seat.empty .seat-name {
            font-size: 1em;
        }

        /* 佔用座位 */
        .seat.occupied {
             box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .seat.occupied:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 20px var(--star-gold);
            z-index: 10;
        }

        .seat.occupied .seat-name {
            font-weight: bold;
            font-size: 1.1em;
            text-align: center;
            line-height: 1.1;
            width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 被停用的座位 */
        .seat.disabled {
            background: var(--baobab-brown);
            border-color: #3e2723;
            cursor: not-allowed;
            color: #a1887f;
        }
        .seat.disabled .seat-name {
            font-size: 2em;
        }

        /* 座號 */
        .seat-number {
            font-size: 0.9em;
            font-weight: bold;
            color: var(--space-blue);
            position: absolute;
            top: 0;
            right: 0;
            background: var(--star-gold);
            padding: 2px 5px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            min-width: 16px;
            text-align: center;
            z-index: 2;
        }
        
        .seat.disabled .seat-number, .seat.empty .seat-number { display: none; }

        .status-msg {
            margin-top: 15px;
            color: var(--rose-red);
            font-weight: bold;
            font-size: 1.2em;
        }
        
        input[type="file"] { display: none; }
        
        .file-upload-label {
            display: inline-block;
            padding: 8px 15px;
            background: white;
            border: 2px dashed var(--space-blue);
            border-radius: 10px;
            cursor: pointer;
            color: var(--space-blue);
            font-weight: bold;
            font-size: 1em;
            transition: 0.3s;
        }
        .file-upload-label:hover { 
            background: #e3f2fd; 
            border-color: var(--star-gold);
        }
    </style>
</head>
<body>

    <h1>小王子的星際旅行
        <span>B-612 星球動態座位系統</span>
    </h1>

    <div class="controls">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <a href="index.html" class="help-link" style="background: #fff8e1; border: 1px solid var(--star-gold);">
                🏠 回首頁大廳
            </a>
            <a href="instructions.html" target="_blank" class="help-link">
                ❓ 如何使用本系統？
            </a>
        </div>

        <h3>1. 設定星系座標 (座位排列)</h3>
        <div class="input-group">
            <div class="input-wrapper">
                <label for="colsInput">排 (Cols):</label>
                <input type="number" id="colsInput" value="6" min="1" max="15">
            </div>
            <div class="input-wrapper">
                <label for="rowsInput">列 (Rows):</label>
                <input type="number" id="rowsInput" value="6" min="1" max="20">
            </div>
            <button class="btn create" onclick="updateGridDimensions()">🪐 重塑星系</button>
        </div>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px dashed #ccc;">

        <h3>2. 邀請旅伴 (匯入名單)</h3>
        <br>
        <label for="upload" class="file-upload-label">📜 點此選擇名單 Excel</label>
        <input type="file" id="upload" accept=".xlsx, .xls" />
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px dashed #ccc;">
        
        <h3>3. 星球管理</h3>
        <p class="hint">點擊空星球可標記為「長滿猴麵包樹」(停用)</p>
        
        <div class="btn-group">
            <button class="btn" onclick="generateSeating()">✨ 星際傳送 (隨機)</button>
            <button class="btn secondary" onclick="resetSeats()">🧹 清理星球 (重置)</button>
            <button class="btn save" onclick="exportToExcel()">🐑 幫我畫一張座位表 (Excel)</button>
        </div>
        
        <div id="status" class="status-msg"></div>
    </div>

    <div class="podium-area">
        <div class="teacher-desk">🌹 講台</div>
        
        <div id="capacity-counter">
            可居住的星球: 36 / 36
        </div>
    </div>

    <div class="grid-container" id="classroom">
        </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gridContainer = document.getElementById('classroom');
            const statusMsg = document.getElementById('status');
            const uploadInput = document.getElementById('upload');
            const fileLabel = document.querySelector('.file-upload-label');
            const capacityCounter = document.getElementById('capacity-counter');
            
            let studentsData = [];
            
            // 修改處：預設 6排 x 6列
            let currentCols = 6;
            let currentRows = 6;
            let totalSeats = currentRows * currentCols;

            // 1. 動態重塑星系功能
            window.updateGridDimensions = function() {
                const c = parseInt(document.getElementById('colsInput').value);
                const r = parseInt(document.getElementById('rowsInput').value);

                if (isNaN(c) || c < 1 || isNaN(r) || r < 1) {
                    alert("請輸入有效的數字！");
                    return;
                }
                
                if (confirm("重塑星系將會清空目前的座位安排，確定要繼續嗎？")) {
                    currentCols = c;
                    currentRows = r;
                    totalSeats = currentRows * currentCols;
                    
                    // 重置資料
                    studentsData = [];
                    statusMsg.textContent = '';
                    fileLabel.innerHTML = `📜 點此選擇名單 Excel`;
                    
                    // 重新產生網格
                    initGrid();
                    statusMsg.style.color = 'var(--text-color)';
                    statusMsg.textContent = `星系已更新為 ${currentCols} 排 X ${currentRows} 列。`;
                }
            }

            // 2. 初始化網格
            function initGrid() {
                gridContainer.innerHTML = '';
                
                // 動態設定 CSS Grid 的列數
                gridContainer.style.gridTemplateColumns = `repeat(${currentCols}, 1fr)`;

                for (let i = 0; i < totalSeats; i++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat empty';
                    seat.dataset.index = i;
                    
                    // 預設內容
                    seat.innerHTML = `<span class="seat-name">空星球</span>`;

                    // 點擊事件
                    seat.addEventListener('click', function() {
                        if (this.classList.contains('occupied')) return;

                        this.classList.toggle('disabled');
                        this.classList.toggle('empty');

                        if (this.classList.contains('disabled')) {
                            this.innerHTML = `<span class="seat-name" title="猴麵包樹">🌱</span>`;
                        } else {
                            this.innerHTML = `<span class="seat-name">空星球</span>`;
                        }
                        
                        updateCapacity();
                    });

                    gridContainer.appendChild(seat);
                }
                updateCapacity();
            }

            // 更新可用座位數量
            function updateCapacity() {
                const disabledCount = document.querySelectorAll('.seat.disabled').length;
                const available = totalSeats - disabledCount;
                capacityCounter.textContent = `可居住的星球: ${available} / ${totalSeats}`;
                
                if (available < 10) {
                    capacityCounter.style.color = '#ff8a80'; 
                    capacityCounter.style.borderColor = '#ff8a80';
                } else {
                    capacityCounter.style.color = 'var(--planet-cream)';
                    capacityCounter.style.borderColor = 'var(--star-gold)';
                }
            }

            // 3. 處理 Excel 上傳
            uploadInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                fileLabel.innerHTML = `📜 已讀取：${file.name}`;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                        
                        studentsData = jsonData.map(row => {
                            const name = row['姓名'] || row['Name'] || row['name'];
                            const number = row['座號'] || row['No'] || row['id'];
                            if (name) return { name, number: number || '' };
                            return null;
                        }).filter(item => item !== null);

                        statusMsg.style.color = '#2e7d32';
                        statusMsg.innerHTML = `✨ 成功邀請 ${studentsData.length} 位旅伴！`;
                    } catch (error) {
                        statusMsg.textContent = "讀取失敗，請確認檔案格式。";
                    }
                };
                reader.readAsArrayBuffer(file);
            });

            // 4. 隨機洗牌
            window.shuffleArray = function(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            // 5. 產生座位
            window.generateSeating = function() {
                if (studentsData.length === 0) {
                    alert('請先匯入名單！');
                    return;
                }

                const allSeats = Array.from(document.querySelectorAll('.seat'));
                const activeSeats = allSeats.filter(seat => !seat.classList.contains('disabled'));

                if (activeSeats.length < studentsData.length) {
                    alert(`星球不夠了！\n旅伴有 ${studentsData.length} 人\n空星球只有 ${activeSeats.length} 個。`);
                    return;
                }

                let shuffledStudents = window.shuffleArray([...studentsData]);

                // 清空有效座位
                activeSeats.forEach(seat => {
                    seat.className = 'seat empty';
                    seat.innerHTML = `<span class="seat-name">空星球</span>`;
                });

                // 填入學生
                shuffledStudents.forEach((student, index) => {
                    const seat = activeSeats[index];
                    seat.className = 'seat occupied';
                    
                    const numberHtml = student.number ? `<span class="seat-number">${student.number}</span>` : '';
                    seat.innerHTML = `
                        ${numberHtml}
                        <span class="seat-name">${student.name}</span>
                    `;
                });

                statusMsg.style.color = '#1a237e';
                statusMsg.innerHTML = `⭐ 安排完成！${studentsData.length} 位旅伴已登陸。`;
            }

            // 6. 重置
            window.resetSeats = function() {
                if(confirm('確定要清理所有星球嗎？')) {
                    initGrid(); 
                    statusMsg.textContent = '';
                    studentsData = [];
                    fileLabel.innerHTML = `📜 點此選擇名單 Excel`;
                }
            }

            // 7. 匯出成 Excel
            window.exportToExcel = function() {
                const seats = document.querySelectorAll('.seat');
                
                let exportData = [];
                
                exportData.push(["小王子的星際教室 - 座位表"]);
                exportData.push([`配置：${currentCols} 排 X ${currentRows} 列`, `紀錄時間：${new Date().toLocaleString()}`]);
                exportData.push([]); 
                
                // 講台位置示意
                let podiumRow = Array(currentCols).fill("");
                let centerIndex = Math.floor((currentCols - 1) / 2);
                podiumRow[centerIndex] = "【講台】";
                exportData.push(podiumRow);
                exportData.push([]); 

                // 建立動態矩陣
                let currentRow = [];
                seats.forEach((seat, index) => {
                    let cellContent = "";
                    
                    if (seat.classList.contains('disabled')) {
                        cellContent = "🌲\n(猴麵包樹)";
                    } else if (seat.classList.contains('occupied')) {
                         const name = seat.querySelector('.seat-name').innerText;
                         const noSpan = seat.querySelector('.seat-number');
                         const no = noSpan ? noSpan.innerText : "";
                         cellContent = no ? `[${no}] ${name}` : name;
                    } else {
                        cellContent = "⭐\n(空星球)";
                    }
                    
                    currentRow.push(cellContent);

                    // 依照 currentCols 換行
                    if ((index + 1) % currentCols === 0) {
                        exportData.push(currentRow);
                        currentRow = []; 
                    }
                });
                
                if (currentRow.length > 0) {
                    exportData.push(currentRow);
                }

                const ws = XLSX.utils.aoa_to_sheet(exportData);
                
                // 設定欄寬
                let wscols = [];
                for(let i=0; i<currentCols; i++) {
                    wscols.push({wch:15});
                }
                ws['!cols'] = wscols;

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "B-612 座位表");

                XLSX.writeFile(wb, "小王子座位表.xlsx");
            }

            // 啟動初始化
            initGrid();
        });
    </script>
</body>
</html>
